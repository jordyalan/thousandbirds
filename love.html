<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的理想ㄆ友名單 (最新修正版)</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "Heiti TC", Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }
        select:focus {
            border-color: #28a745;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        
        /* 統計資訊區域 */
        .stats-header {
            margin-top: 25px;
            font-size: 1.1em;
            color: #28a745;
            font-weight: bold;
            text-align: center;
        }
        .stats-footer {
            margin-top: 15px;
            font-size: 0.9em;
            color: #888;
            text-align: right;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .result-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }
        .result-list li {
            background: #f8f9fa;
            margin: 5px 0;
            padding: 10px 15px;
            border-radius: 5px;
            border-left: 5px solid #28a745;
            color: #333;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tag {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 10px;
            background: #e9ecef;
            color: #495057;
            font-weight: bold;
        }
        .no-result {
            color: #888;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #fff;
            border: 1px dashed #ccc;
            border-radius: 5px;
        }

        /* 真命天子推薦區塊 */
        .recommendation-box {
            margin-top: 25px;
            background: linear-gradient(135deg, #fff0f0 0%, #ffe6e6 100%);
            border: 2px solid #ffc1c1;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            display: none; /* 預設隱藏 */
            animation: popIn 0.5s ease-out;
        }
        .recommendation-title {
            color: #e83e8c;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .recommendation-name {
            font-size: 1.5em;
            color: #333;
            font-weight: bold;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .note {
            font-size: 13px;
            color: #666;
            margin-top: 20px;
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌈 我的理想ㄆ友名單 💦</h2>

    <div class="form-group">
        <label for="roleSelect">1. 我的角色 (尋找對象)</label>
        <select id="roleSelect">
            <option value="1">🍆1號 (列出 0號、不分)</option>
            <option value="0">🫶0號 (列出 1號、不分)</option>
            <option value="0.5">🕺不分 (列出 1號、0號、不分)</option>
            <option value="Side">👋Side (列出 Side)</option>
            <option value="69">💋純69 (列出 純69)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="myBody">2. 我的體型 </label>
        <select id="myBody">
            <option value="熊">熊🐻</option>
            <option value="猴">猴🐒</option>
        </select>
    </div>

    <div class="form-group">
        <label for="prefBody">3. 喜歡的體型❤️</label>
        <select id="prefBody">
            <option value="熊">熊🐻</option>
            <option value="猴">猴🐒</option>
            <option value="都可">🐻🐒都可</option>
        </select>
    </div>

    <button onclick="filterList()">🔍 開始篩選</button>

    <!-- 結果顯示區域 -->
    <div id="result-area">
        <!-- 1. 顯示符合數量 -->
        <div id="matchCountHeader" class="stats-header"></div>
        
        <!-- 列表 -->
        <ul id="resultList" class="result-list"></ul>
        
        <!-- 2. 顯示總資料庫人數 -->
        <div id="totalDbFooter" class="stats-footer"></div>
    </div>

    <!-- 3. 真命天子推薦 -->
    <div id="recommendationBox" class="recommendation-box">
        <div class="recommendation-title">💘 他可能是你的真命天子</div>
        <div id="luckyOneName" class="recommendation-name"></div>
    </div>
    
    <div class="note">
        <strong>更新說明：</strong><br>
        已修正資料庫：將「史宇弓ㄙ」正確加入名單，確保篩選功能正常。
    </div>
</div>

        "熊猴都可": [

            "阿任", "XuezheWu 學哲", "貓貓貓", "毛怪Mao(*'へ'*)", "Alex 吳維", 
            "🌹Lucas竣🌹", "不分阿布", "💪輝仔🐒🐵", "浩浩🐱", "CKB", 
            "event (凱凱)", "馬健綸", "逸倫", "柏丞 (39計程車)", "端峻", 
            "🐻🐯 熊虎（大熊）Eric🐻🐯", "🌹俊曉", "🌹𝓜𝓢林罐罐1.0", "克寶J大寶", 
            "Jordy", "Scott Huang", "𝓜𝓢阿尼尼", "Naker", "VW boyuan", "XH𝓜𝓟🌹", 
            "阿東", "JimYu", "👍宇哲/Adolph/阿麥❤️", "小金阿傑"
        ]
    };

    // 計算有效資料庫人數的功能
    function getValidDatabaseCount() {
        const normalize = (str) => str.replace(/\s+/g, '').toLowerCase();

        // 1. 取得所有角色名單中的不重複人名
        let allRolePeople = new Set();
        Object.values(roleData).forEach(list => {
            list.forEach(name => allRolePeople.add(normalize(name)));
        });

        // 2. 取得所有體型名單中的不重複人名
        let allTypePeople = new Set();
        Object.values(typeData).forEach(list => {
            list.forEach(name => allTypePeople.add(normalize(name)));
        });

        // 3. 取交集
        let validCount = 0;
        allRolePeople.forEach(name => {
            if (allTypePeople.has(name)) {
                validCount++;
            }
        });

        return validCount;
    }

    function filterList() {
        const userRole = document.getElementById('roleSelect').value;
        const myBody = document.getElementById('myBody').value;
        const prefBody = document.getElementById('prefBody').value;
        
        const resultListEl = document.getElementById('resultList');
        const matchCountHeader = document.getElementById('matchCountHeader');
        const totalDbFooter = document.getElementById('totalDbFooter');
        const recommendationBox = document.getElementById('recommendationBox');
        const luckyOneName = document.getElementById('luckyOneName');

        resultListEl.innerHTML = ""; 
        matchCountHeader.innerHTML = "";
        totalDbFooter.innerHTML = "";
        recommendationBox.style.display = "none";

        // 1. 角色篩選
        let roleCandidates = [];
        if (userRole === "1") {
            roleCandidates = [...roleData["不分"], ...roleData["0號"]];
        } else if (userRole === "0") {
            roleCandidates = [...roleData["不分"], ...roleData["1號"]];
        } else if (userRole === "0.5") { 
            roleCandidates = [...roleData["1號"], ...roleData["0號"], ...roleData["不分"]];
        } else if (userRole === "Side") {
            roleCandidates = [...roleData["Side"]];
        } else if (userRole === "69") {
            roleCandidates = [...roleData["純69"]];
        }

        // 2. 體型篩選
        let typeCandidates = [];

        if (myBody === "熊" && prefBody === "熊") {
            typeCandidates = [...typeData["熊喜熊"]];
        } 
        else if (myBody === "熊" && prefBody === "猴") {
            typeCandidates = [...typeData["猴喜熊"]]; 
        } 
        else if (myBody === "猴" && prefBody === "熊") {
            typeCandidates = [...typeData["熊喜猴"]]; 
        } 
        else if (myBody === "猴" && prefBody === "猴") {
            typeCandidates = [...typeData["猴喜猴"]];
        } 
        else if (myBody === "猴" && prefBody === "都可") {
            typeCandidates = [...typeData["猴喜猴"], ...typeData["熊猴都可"], ...typeData["熊喜猴"]];
        } 
        else if (myBody === "熊" && prefBody === "都可") {
            typeCandidates = [...typeData["熊喜熊"], ...typeData["熊猴都可"], ...typeData["猴喜熊"]];
        }

        // 3. 交叉比對
        // 使用移除空白並轉小寫的方式來進行寬鬆比對
        const normalize = (str) => str.replace(/\s+/g, '').toLowerCase();
        
        // 建立體型候選人的 Set 以加速比對
        const typeSet = new Set(typeCandidates.map(name => normalize(name)));

        const finalResults = roleCandidates.filter(name => {
            return typeSet.has(normalize(name));
        });

        // 移除重複結果
        const uniqueResults = [...new Set(finalResults)];

        // 4. 顯示結果
        if (uniqueResults.length > 0) {
            matchCountHeader.innerHTML = `🎉 找到符合條件的有：${uniqueResults.length} 位`;

            uniqueResults.forEach(name => {
                const li = document.createElement('li');
                let roleTag = "其他";
                // 找出該成員的角色標籤
                for (const [role, list] of Object.entries(roleData)) {
                    if (list.includes(name)) {
                        roleTag = role;
                        break;
                    }
                }
                li.innerHTML = `<span>${name}</span> <span class="tag">${roleTag}</span>`;
                resultListEl.appendChild(li);
            });

            // 推薦功能
            const randomIndex = Math.floor(Math.random() * uniqueResults.length);
            const luckyOne = uniqueResults[randomIndex];
            luckyOneName.textContent = luckyOne;
            recommendationBox.style.display = "block";

        } else {
            matchCountHeader.innerHTML = `😢 找到符合條件的有：0 位`;
            resultListEl.innerHTML = '<li class="no-result">沒有找到符合條件的對象 🙅‍♂️</li>';
        }

        // 統計
        const totalValidCount = getValidDatabaseCount();
        totalDbFooter.innerHTML = `📊 目前資料庫有效總人數：${totalValidCount} 位`;
    }
</script>

</body>
</html>
